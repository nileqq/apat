<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіркелу — Qazaq Mura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/main.css">
    <link rel="stylesheet" href="../CSS/header.css">
    <link rel="stylesheet" href="../CSS/auth.css">
</head>
<body>
    <div id="root">

        <header>
            <div class="header-inner">
                <a href="main.html" class="logo">
                    <img class="logo-mark" src="../assets/crow-white-transparent.png" alt="Апат" height="44">
                    <div class="logo-text">
                        <span class="logo-title">Qazaq Mura</span>
                        <span class="logo-sub">Естелік архиві</span>
                    </div>
                </a>
                <nav>
                    <a href="main.html" data-i18n="nav_articles">Мақалалар</a>
                    <a href="#"         data-i18n="nav_about">Жоба туралы</a>
                </nav>
                <div class="lang-switcher">
                    <button class="lang-btn active" data-lang="kk">ҚАЗ</button>
                    <button class="lang-btn"        data-lang="ru">РУС</button>
                    <button class="lang-btn"        data-lang="en">ENG</button>
                </div>
            </div>
        </header>

        <main class="auth-main">
            <div class="auth-card">

                <div class="auth-header">
                    <h1 class="auth-title" data-i18n="register_title">Тіркелу</h1>
                    <p class="auth-sub" data-i18n="register_sub">Жаңа аккаунт жасаңыз</p>
                </div>

                <form class="auth-form" id="registerForm" novalidate>

                    <div class="field-group">
                        <label class="field-label" for="name" data-i18n="field_name">Аты-жөні</label>
                        <input
                            class="field-input"
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            data-i18n-ph="field_name_ph"
                            placeholder="Айдар Сейітов"
                        >
                        <span class="field-error" id="nameError"></span>
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="email" data-i18n="field_email">Электрондық пошта</label>
                        <input
                            class="field-input"
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            data-i18n-ph="field_email_ph"
                            placeholder="example@mail.com"
                        >
                        <span class="field-error" id="emailError"></span>
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="password" data-i18n="field_password">Құпия сөз</label>
                        <div class="password-wrapper">
                            <input
                                class="field-input"
                                type="password"
                                id="password"
                                name="password"
                                autocomplete="new-password"
                                data-i18n-ph="field_password_ph"
                                placeholder="••••••••"
                            >
                            <button type="button" class="toggle-pass" id="togglePass" aria-label="Құпия сөзді көрсету">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <span class="field-hint" data-i18n="password_hint">Кемінде 8 таңба</span>
                        <span class="field-error" id="passwordError"></span>
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="confirm" data-i18n="field_confirm">Растау</label>
                        <input
                            class="field-input"
                            type="password"
                            id="confirm"
                            name="confirm"
                            autocomplete="new-password"
                            data-i18n-ph="field_confirm_ph"
                            placeholder="••••••••"
                        >
                        <span class="field-error" id="confirmError"></span>
                    </div>

                    <div id="formError" class="form-error" hidden></div>

                    <button type="submit" class="auth-submit" data-i18n="register_submit">Тіркелу →</button>

                </form>

                <div class="auth-switch">
                    <span data-i18n="register_have_account">Аккаунтыңыз бар ма?</span>
                    <a href="login.html" data-i18n="register_login_link">Кіру</a>
                </div>

            </div>
        </main>

    </div>

    <script src="../JS/i18n.js"></script>
    <script src="../JS/auth.js"></script>
</body>
</html>
